tasks:
  - name: aws-cli
    env:
      AWS_CLI_AUTO_PROMPT: on-partial
    init: |
      cd /workspace
      curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
      unzip awscliv2.zip
      sudo ./aws/install
      complete -C "/usr/local/bin/aws_completer" aws
      touch videomark.txt
      touch awskeys.txt
      echo "export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> awskeys.txt
      echo "export EMAIL_ID=olaleyeolawale2020@outlook.com" >> awskeys.txt
      cd $THEIA_WORKSPACE_ROOT

vscode:
  extensions:
    - 42Crunch.vscode-openapi